{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/registration/register.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}

{% block content %}
<div class="container">
    <div class="recovery-card">
        <div class="icon-container">
            <div class="lock-icon">
                <i class="fas fa-unlock-alt"></i>
            </div>
        </div>  

        <h1>Redefinir Senha</h1>
        <p class="subtitle">Digite uma nova senha válida abaixo.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <div class="form-group mb-4">
                <label for="id_new_password1" class="form-label">Nova Senha</label>
                <input type="password" name="new_password1" id="id_new_password1" class="form-control form-control-lg" placeholder="Digite sua nova senha" required>
                {{ form.new_password1.errors }}
            </div>

            <div class="form-group mb-4">
                <label for="id_new_password2" class="form-label">Confirmar Senha</label>
                <input type="password" name="new_password2" id="id_new_password2" class="form-control form-control-lg" placeholder="Confirme sua nova senha" required>
                {{ form.new_password2.errors }}
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Redefinir Senha
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/registration/register.js' %}"></script>
{% endblock %}
