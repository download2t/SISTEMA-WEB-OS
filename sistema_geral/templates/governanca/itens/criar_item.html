{% extends 'core/base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/governanca/criar_item.css' %}?v=1.0">
{% endblock %}
{% block content %}
<div class="container mt-5">
    <h1>Adicionar Novo Item</h1></br>
    <form method="post" action="{% url 'create_item_lavanderia' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'item_lavanderia_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
