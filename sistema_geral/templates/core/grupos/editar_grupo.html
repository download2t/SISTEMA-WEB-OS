{% extends 'core/base.html' %}
{% load static %}

{% block extra_css %}

{% endblock %}

{% block content %}
<h1 class="mt-5">Editar Grupo: {{ grupo.name }}</h1>

<!-- Formulário para editar grupo -->
<form method="post" action="{% url 'editar_grupo' grupo.id %}" class="mt-4">
    {% csrf_token %}
    <div class="mb-3">
        <label for="nome" class="form-label">Nome do Grupo</label>
        <input type="text" name="nome" id="nome" class="form-control" value="{{ grupo.name }}" placeholder="Digite o nome do grupo">
    </div>
    <button type="submit" class="btn btn-warning">Atualizar</button>
    <a href="{% url 'listar_grupos' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
