{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 100vh; background-color: #f7f9fc;">
    <div class="col-md-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <h2 class="text-center mb-4" style="color: #4C6B8C; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Acessar</h2>

                <!-- Mensagem de erro ou sucesso -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} mb-3" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <!-- Formulário de login -->
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="form-group mb-3">
                        <label for="username" class="form-label" style="font-weight: 600; color: #4C6B8C;">Usuário</label>
                        <input type="text" id="username" name="username" class="form-control form-control-lg" placeholder="Digite seu usuário" required>
                    </div>
                    <div class="form-group mb-4">
                        <label for="password" class="form-label" style="font-weight: 600; color: #4C6B8C;">Senha</label>
                        <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="Digite sua senha" required>
                    </div>

                    <!-- Botão de login -->
                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-3" style="background-color: #4C6B8C; border: none;">Entrar</button>
                    
                    <!-- Link para recuperar senha -->
                    <div class="mt-3 text-center">
                        <a href="{% url 'password_reset' %}" class="text-decoration-none" style="color: #4C6B8C; font-weight: 600;">Esqueceu a senha?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}
