{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<!-- Formulário para editar usuário com grupos -->
<div class="d-flex justify-content-center align-items-center" style="height: calc(100vh - 100px); padding-top: 200px;">
    <div class="col-lg-8 col-md-10 col-sm-12">
        <div class="card shadow-sm p-4 rounded-3 bg-light">
            <h2 class="text-center mb-4">Alterar Usuário</h2>

            <form method="post" action="{% url 'alterar_usuario' user.id %}">
                {% csrf_token %}
                
                <!-- Campo: Nome de Usuário -->
                <div class="mb-3">
                    <label for="username" class="form-label">Nome de Usuário:</label>
                    <input type="text" id="username" name="username" class="form-control" value="{{ form.username.value|default_if_none:user.username }}" required>
                </div>

                <!-- Campo: Primeiro Nome -->
                <div class="mb-3">
                    <label for="first_name" class="form-label">Primeiro Nome:</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" value="{{ form.first_name.value|default_if_none:user.first_name }}" required>
                </div>

                <!-- Campo: Último Nome -->
                <div class="mb-3">
                    <label for="last_name" class="form-label">Último Nome:</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" value="{{ form.last_name.value|default_if_none:user.last_name }}" required>
                </div>

                <!-- Campo: E-mail -->
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="email" id="email" name="email" class="form-control" value="{{ form.email.value|default_if_none:user.email }}" required>
                </div>

                <!-- Campo: Status (Ativo/Inativo) -->
                <div class="mb-3">
                    <label for="is_active" class="form-label">Status:</label>
                    <select id="is_active" name="is_active" class="form-select">
                        <option value="True" {% if user.is_active %}selected{% endif %}>Ativo</option>
                        <option value="False" {% if not user.is_active %}selected{% endif %}>Inativo</option>
                    </select>
                </div>


                <!-- Seção de grupos -->
                <div class="mb-3">
                    <div class="row">
                        <div class="col-md-5">
                            <label for="available_groups" class="form-label">Grupos Disponíveis:</label>
                            <select id="available_groups" name="available_groups" class="form-control" size="8" multiple>
                                {% for group in all_groups %}
                                    {% if group not in user_groups %}
                                        <option value="{{ group.id }}">{{ group.name }}</option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-2 d-flex flex-column justify-content-center align-items-center">
                            <button type="button" id="add_group" class="btn btn-primary w-100 mb-2">Adicionar &gt;</button>
                            <button type="button" id="remove_group" class="btn btn-danger w-100 mb-2">&lt; Remover</button>
                        </div>
                        <div class="col-md-5">
                            <label for="assigned_groups" class="form-label">Grupos Escolhidos:</label>
                            <select id="assigned_groups" name="groups" class="form-control" size="8" multiple>
                                {% for group in user_groups %}
                                    <option value="{{ group.id }}" selected>{{ group.name }}</option>
                                {% endfor %}
                            </select>                            
                        </div>
                    </div>
                </div>

                <!-- Botões -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary w-100">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</div>


{% endblock %}

{% block extra_css %}
<script>
    /* Estilos adicionais */
    #available_groups, #assigned_groups {
        height: 200px;
        width: 100%;
    }

    button {
        width: 100%;
    }

    #available_groups, #assigned_groups {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    select {
        margin: 5px 0;
    }

    button {
        margin-top: 10px;
    }
</script>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Adicionar grupo
        document.getElementById('add_group').addEventListener('click', function () {
            var availableGroups = document.getElementById('available_groups');
            var assignedGroups = document.getElementById('assigned_groups');
            var selectedOptions = Array.from(availableGroups.selectedOptions);

            selectedOptions.forEach(function (option) {
                option.selected = true; // Marcar como selecionado para envio
                assignedGroups.appendChild(option); // Mover para "Grupos Escolhidos"
            });
        });

        // Remover grupo
        document.getElementById('remove_group').addEventListener('click', function () {
            var availableGroups = document.getElementById('available_groups');
            var assignedGroups = document.getElementById('assigned_groups');
            var selectedOptions = Array.from(assignedGroups.selectedOptions);

            selectedOptions.forEach(function (option) {
                option.selected = false; // Remover seleção para evitar envio
                availableGroups.appendChild(option); // Mover para "Grupos Disponíveis"
            });
        });

        // Garantir que os itens da lista escolhida sejam enviados ao backend
        document.querySelector('form').addEventListener('submit', function () {
            var assignedGroups = document.getElementById('assigned_groups');
            Array.from(assignedGroups.options).forEach(function (option) {
                option.selected = true; // Selecionar todos os itens para envio
            });
        });
    });
</script>
{% endblock %}
