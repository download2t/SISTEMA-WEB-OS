{% extends 'core/base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 100vh; background-color: #f4f6f9;">
    <div class="col-md-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <h2 class="text-center mb-4" style="color: #4C6B8C;">Recuperação de Senha</h2>

                <form method="post">
                    {% csrf_token %}
                    <div class="form-group mb-4">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" name="email" class="form-control form-control-lg" placeholder="Digite seu e-mail" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Enviar Link de Recuperação</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
