{% extends 'core/base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 100vh; background-color: #f4f6f9;">
    <div class="col-md-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <h2 class="text-center mb-4" style="color: #4C6B8C;">Redefinir Senha</h2>

                <form method="post">
                    {% csrf_token %}
                    <div class="form-group mb-4">
                        <label for="new_password" class="form-label">Nova Senha</label>
                        <input type="password" id="new_password" name="new_password" class="form-control form-control-lg" placeholder="Digite sua nova senha" required>
                    </div>
                    <div class="form-group mb-4">
                        <label for="confirm_password" class="form-label">Confirmar Senha</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control form-control-lg" placeholder="Confirme sua nova senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Redefinir Senha</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
