{% extends 'core/base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 100vh; background-color: #f4f6f9;">
    <div class="col-md-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <h2 class="text-center mb-4" style="color: #4C6B8C;">E-mail Enviado</h2>
                <p>Um link para redefinir sua senha foi enviado para o seu e-mail. Por favor, verifique sua caixa de entrada e siga as instruções.</p>
                <div class="text-center">
                    <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2">Voltar ao Login</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
