{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 80vh;">
    <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
        <div class="text-center">
            <h3 class="mb-4">Tem certeza que deseja sair?</h3>
            <p>Você está prestes a sair da sua conta. Se você não tem certeza, pode cancelar a ação.</p>

            <!-- Formulário de Logout -->
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg w-100 mb-2">
                    <i class="fas fa-sign-out-alt me-2"></i> Sair
                </button>
            </form>
            
            <!-- Botão Cancelar -->
            <a href="{% url 'home' %}" class="btn btn-secondary btn-lg w-100">
                <i class="fas fa-arrow-left me-2"></i> Cancelar
            </a>
        </div>
    </div>
</div>
{% endblock %}
