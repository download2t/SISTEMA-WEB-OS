{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar Saída</title>
    <link rel="icon" href="/static/images/logo_sanma_ico.ico" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container fade-in">
        <div class="recovery-card">
            <div class="icon-container">
                <div class="lock-icon">

                    <i class="fas fa-sign-out-alt"></i> 
                </div>
            </div>
            <h1>Tem certeza que deseja sair?</h1>
            <p class="subtitle">
                Você está prestes a encerrar sua sessão.
            </p>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn-submit" style="background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </form>
            <div class="back-link mt-3">
                <a href="{% url 'home' %}"> 
                    <i class="fas fa-arrow-left"></i> Voltar à Página Inicial
                </a>
            </div>
        </div>
    </div>

</body>
</html>
