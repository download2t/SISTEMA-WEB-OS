{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 80vh; background-color: #f4f6f9;">
    <div class="card shadow-lg border-0 rounded-4" style="max-width: 400px; width: 100%;">
        <div class="card-body p-5 text-center">
            <h3 class="mb-4" style="color: #4C6B8C;">Tem certeza que deseja sair?</h3>
            <p class="text-muted mb-4">Você está prestes a sair da sua conta. Caso não tenha certeza, pode cancelar a ação.</p>

            <!-- Formulário de Logout -->
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg w-100 mb-3">
                    <i class="fas fa-sign-out-alt me-2"></i> Sair
                </button>
            </form>
            
            <!-- Botão Cancelar -->
            <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-lg w-100">
                <i class="fas fa-arrow-left me-2"></i> Cancelar
            </a>
        </div>
    </div>
</div>
{% endblock %}
