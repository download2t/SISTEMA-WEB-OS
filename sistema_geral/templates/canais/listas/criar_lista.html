{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <h1>Criar Lista de Canais</h1>
    <form method="post" action="{% url 'criar_lista' %}">
        {% csrf_token %}
        {{ form.as_p }}  <!-- O Django renderiza automaticamente os campos do formulário -->
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'listar_listas' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
