{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="container">
    <h1 class="mb-4">Adicionar Novo Canal</h1>
    <!-- Formulário para criar canal -->
    <form method="post" action="{% url 'criar_canal' %}" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label for="numero" class="form-label">Número do Canal</label>
            <input type="number" name="numero" id="numero" class="form-control" placeholder="Digite o número do canal" value="{{ form.numero.value }}" required>
        </div>

        <div class="mb-3">
            <label for="titulo" class="form-label">Título do Canal</label>
            <input type="text" name="titulo" id="titulo" class="form-control" placeholder="Digite o título do canal" value="{{ form.titulo.value }}" required>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{% url 'listar_canais' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
